<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieTime - Login</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/re-log.css" />
    <link rel="icon" href="assets/logoo.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>

  <body>
    <div class="login-box">
      <a href="../index.html" class="logo">
        <img
            src="../assets/logo-movie.png"
            alt="MovieTime Logo"
            class="logo-image"
          />
          <h1>Movie<span>Time</span></h1>
      </a>
      <h1>Welcome Back</h1>
      <p class="text">Login untuk melanjutkan ke MovieTime.</p>

      <form id="login-form">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="Masukkan email" />
        <label>Password</label>
        <input
          type="password"
          id="login-password"
          placeholder="Masukkan password"
        />
        <button type="submit">Login</button>
      </form>

      <p class="register-text">
        Belum punya akun?
        <a href="register.html">Daftar</a>
      </p>

      <a href="../index.html" class="back">← Kembali ke Home</a>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
