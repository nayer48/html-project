<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieTime - Movies</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/movi-tv.css" />
  <link rel="icon" href="assets/logoo.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
</head>

<body>
  <!-- ================= HEADER ================= -->
  <div class="header-nav">
    <header>
      <a href="../index.html">
        <img src="../assets/logo-movie.png" alt="MovieTime Logo" class="logo-image" />
        <h1>Movie<span>Time</span></h1>
      </a>
    </header>

    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="movies.html" class="active">Movies</a></li>
        <li><a href="tv-show.html">TV Shows</a></li>
      </ul>
    </nav>

    <div class="kanan-nav">
      <div class="search-box">
        <span class="material-symbols-outlined search-icon">search</span>
        <input class="search" id="search-input" type="text" placeholder="Search Movie..." />
      </div>
      <button class="theme-button" type="button"></button>
      <div class="auth-area" data-base=""></div>
    </div>
  </div>

  <!-- ================= MAIN ================= -->
  <main>
    <section class="movie-header">
      <p class="judul-kecil">EXPLORE MOVIES</p>
      <h1>Movies</h1>
      <p class="deskripsi">Find the movie you want to watch.</p>
    </section>

    <!-- ================= GENRE ================= -->
    <section class="genre-section">
      <h2>Genre</h2>
      <div class="genre-list">
        <button class="genre active" data-genre="all">All</button>
        <button class="genre" data-genre="28">Action</button>
        <button class="genre" data-genre="35">Comedy</button>
        <button class="genre" data-genre="18">Drama</button>
        <button class="genre" data-genre="27">Horror</button>
        <button class="genre" data-genre="10749">Romance</button>
        <button class="genre" data-genre="14">Fantasy</button>
      </div>
    </section>

    <!-- ================= MOVIE LIST ================= -->
    <section class="movies">
      <div id="movie-list" class="movie-list">
        <p>Loading movies...</p>
      </div>
      <!-- PAGINATION -->
      <div id="pagination" class="pagination"></div>
    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer>
    <div class="footer-content">
      <div class="footer-brand">
        <h2>Movie<span>Time</span></h2>
        <p>Your Mood. Your Movie.</p>
      </div>
      <div class="footer-menu">
        <a href="index.html">Home</a>
        <a href="html/movies.html">Movies</a>
        <a href="html/tv-show.html">TV Shows</a>
      </div>
      <div class="footer-social">
        <a href="https://www.instagram.com/arnsttee" target="_blank" aria-label="Instagram"><i
            class="bx bxl-instagram"></i></a>
        <a href="mailto:niarputri157@gmail.com" aria-label="Email"><i class="bx bx-envelope"></i></a>
      </div>
    </div>
    <p>&copy; 2026 MovieTime</p>
    <p>Powered By The Movie Database (TMDB)</p>
  </footer>

  <script src="../js/common.js"></script>
  <script src="../js/movies.js"></script>
</body>

</html>
